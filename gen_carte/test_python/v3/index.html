<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Prototype 3D - Streaming Heightmap PNG</title>
    <style>
        html, body { overflow: hidden; width: 100%; height: 100%; margin: 0; padding: 0; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
        #uiPanel { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.85); color: #00ffcc; padding: 15px; font-family: monospace; border-radius: 5px; border: 1px solid #00ffcc; pointer-events: none; z-index: 10; }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
    <div id="uiPanel">
        <h3 style="margin-top:0;">🗺️ MOTEUR DE STREAMING PNG NATIF</h3>
        <div id="fpsCounter" style="color: #ff0055; font-weight: bold; margin-bottom: 5px;">FPS : --</div> <div id="macroPos">Chunk Centre : Initialisation...</div>
        <div id="macroPos">Chunk Centre : Initialisation...</div>
        <div id="microPos">Position Absolue : X=550.0, Z=550.0</div>
        <div id="worldBounds" style="color: #ffcc00; margin-top: 5px;">Limites Monde : [0m - 10000m]</div>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const API_URL = "http://127.0.0.1:8000/api/world";

// Déclaration de la scène globale accessible partout
let globalScene; // 🟢 Juste le nom, sans 'const', sans valeur !
let scene = null; // Un seul nom unique pour tout le fichier !
let camera = null; // Sortir la caméra au niveau global pour que initGame y accède

        let loadedChunks = {}; 
        let currentCentreX = 5;
        let currentCentreY = 5;
        let isLambdaLoading = false;

        let lastTrackedChunkX = 5;
        let lastTrackedChunkY = 5;

        let worldMinX = 0, worldMaxX = 10000;
        let worldMinZ = 0, worldMaxZ = 10000;

// =========================================================================
// MOTEUR DE RENDU (SÉCURISÉ)
// =========================================================================
engine.runRenderLoop(() => { 
    // Si la scène est instanciée et prête, on la dessine
    if (scene && typeof scene.render === "function") {
        scene.render(); 
        
        // Mise à jour du compteur de FPS HTML
        const fps = engine.getFps().toFixed(0);
        const fpsElement = document.getElementById("fpsCounter");
        if (fpsElement) {
            fpsElement.innerText = `FPS : ${fps}`;
        }
    }
});

   // =========================================================================
// CONSTRUCTEUR DE LA SCÈNE 3D
// =========================================================================
const createScene = function () {
    // On recrée la scène locale temporaire
    const s = new BABYLON.Scene(engine);
    s.clearColor = new BABYLON.Color3(0.5, 0.7, 1.0); 

    s.collisionsEnabled = true;

    // Configuration de la caméra FPS (on alimente la variable globale 'camera')
    camera = new BABYLON.UniversalCamera("playerCam", new BABYLON.Vector3(0, 50, 0), s);
    camera.attachControl(canvas, true);
    
    camera.speed = 1.8;
    camera.angularSensibility = 2000;
    camera.keysUp.push(90); camera.keysDown.push(83); // Z, S
    camera.keysLeft.push(81); camera.keysRight.push(68); // Q, D

    // On désactive les collisions dures pour la flottaison fluide
    camera.checkCollisions = false;
    camera.applyGravity = false;
    
    // Limitation du regard vertical
    camera.upperBetaLimit = Math.PI / 2;
    camera.lowerBetaLimit = -Math.PI / 2;

    canvas.addEventListener("click", () => { canvas.requestPointerLock(); });

// ☀️ 1. LE SOLEIL (Lumière Directionnelle)
// Elle projette des rayons parallèles. On l'oriente en diagonale descendante (-1, -2, -1)
const sunLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1, -2, -1), s);
sunLight.position = new BABYLON.Vector3(0, 100, 0);
sunLight.intensity = 0.7; // Force du soleil

// ☁️ 2. LA LUMIÈRE AMBIANTE (Hémisphérique)
// On baisse son intensité pour que les zones à l'ombre du soleil restent légèrement visibles (pas de noir absolu)
const ambientLight = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), s);
ambientLight.intensity = 0.3; // Baissée de 0.8 à 0.3 pour creuser les ombres

    const terrainMat = new BABYLON.StandardMaterial("terrainMat", s);

    terrainMat.diffuseColor = new BABYLON.Color3(0.3, 0.7, 0.3); 
    terrainMat.specularColor = new BABYLON.Color3(0, 0, 0);       
    terrainMat.backFaceCulling = false;

    // FONCTION DE STREAMING LOGÉE À L'INTÉRIEUR POUR ACCÉDER À LA SCÈNE DIRECTEMENT
    async function updateWorldStreaming(chunkCentreX, chunkCentreY) {
        if (isLambdaLoading) return;
        isLambdaLoading = true;

        document.getElementById("macroPos").innerText = `⚡ STREAMING DES SECTEURS...`;

        const targetChunks = [];
        for (let dx = -1; dx <= 1; dx++) {
            for (let dy = -1; dy <= 1; dy++) {
                const tx = chunkCentreX + dx;
                const ty = chunkCentreY + dy;
                if (tx >= worldMinX/100 && tx < worldMaxX/100 && ty >= worldMinZ/100 && ty < worldMaxZ/100) {
                    targetChunks.push({ x: tx, y: ty });
                }
            }
        }

        const requiredKeys = targetChunks.map(c => `${c.x}_${c.y}`);

        for (let key in loadedChunks) {
            if (!requiredKeys.includes(key)) {
                loadedChunks[key].forEach(mesh => mesh.dispose());
                delete loadedChunks[key];
            }
        }

        targetChunks.forEach(chunk => {
            const key = `${chunk.x}_${chunk.y}`;
            if (loadedChunks[key]) return; 

            loadedChunks[key] = [];

            const offsetX = chunk.x * 100;
            const offsetZ = chunk.y * 100;
            const heightmapUrl = `${API_URL}/chunk/${chunk.x}/${chunk.y}/heightmap.png`;

            // Utilisation de la scène locale 's'
            const ground = BABYLON.MeshBuilder.CreateGroundFromHeightMap(`ground_${key}`, heightmapUrl, {
                width: 100,
                height: 100,
                subdivisions: 100, 
                minHeight: 0,
                maxHeight: 100,      
                onReady: function (mesh) {
                    mesh.position.set(offsetX + 50, 0, offsetZ + 50); 
                    mesh.material = terrainMat;
                    mesh.isPickable = true;
                    mesh.createNormals(true);
                    
                    loadedChunks[key].push(mesh);
                }
            }, s);
        });

        currentCentreX = chunkCentreX;
        currentCentreY = chunkCentreY;
        document.getElementById("macroPos").innerText = `Chunk Centre : X=${currentCentreX}, Y=${currentCentreY}`;
        isLambdaLoading = false;
    }

    // Premier chargement de démarrage
    updateWorldStreaming(currentCentreX, currentCentreY);

    // BOUCLE DE RENDU INTERNE DU RELIEF ET DES MURS
    s.registerBeforeRender(() => {
        if (!camera) return;

        let posX = camera.position.x;
        let posZ = camera.position.z;

        document.getElementById("microPos").innerText = `Position Absolue : X=${posX.toFixed(1)}, Z=${posZ.toFixed(1)}`;

        const playerChunkX = Math.floor(posX / 100);
        const playerChunkY = Math.floor(posZ / 100);

        if ((playerChunkX !== lastTrackedChunkX || playerChunkY !== lastTrackedChunkY) && !isLambdaLoading) {
            lastTrackedChunkX = playerChunkX;
            lastTrackedChunkY = playerChunkY;
            updateWorldStreaming(playerChunkX, playerChunkY);
        }

        // Raycast de flottaison (utilise la scène locale 's')
        const rayOrigin = new BABYLON.Vector3(posX, 200, posZ);
        const rayDirection = new BABYLON.Vector3(0, -1, 0);
        const ray = new BABYLON.Ray(rayOrigin, rayDirection, 300);
        const pickInfo = s.pickWithRay(ray, (mesh) => mesh.name.startsWith("ground_"));

        if (pickInfo.hit && pickInfo.pickedPoint) {
            camera.position.y = BABYLON.Scalar.Lerp(camera.position.y, pickInfo.pickedPoint.y + 2.5, 0.3);
        }

        // Verrouillage dynamique des murs aux frontières de l'API
        const limiteMin = 1.5;
        const limiteMaxX = worldMaxX - 1.5;
        const limiteMaxZ = worldMaxZ - 1.5;

        if (camera.position.x < limiteMin)  { camera.position.x = limiteMin; }
        if (camera.position.x > limiteMaxX) { camera.position.x = limiteMaxX; }
        if (camera.position.z < limiteMin)  { camera.position.z = limiteMin; }
        if (camera.position.z > limiteMaxZ) { camera.position.z = limiteMaxZ; }
    });

    return s; // On renvoie la scène
};

// =========================================================================
// INITIALISATION DU JEU VIA L'API SETTINGS
// =========================================================================
async function initGame() {
    try {
        document.getElementById("macroPos").innerText = `⚙️ CONFIGURATION DE L'API...`;
        
        const response = await fetch(`${API_URL}/settings`);
        const settings = await response.json();
        
        worldMaxX = settings.world_max_x_meters;
        worldMaxZ = settings.world_max_z_meters;
        
        currentCentreX = Math.floor(settings.chunks_count_x / 2);
        currentCentreY = Math.floor(settings.chunks_count_y / 2);
        lastTrackedChunkX = currentCentreX;
        lastTrackedChunkY = currentCentreY;

        document.getElementById("worldBounds").innerText = `Limites Monde : [0m - ${worldMaxX}m]`;
        
        // 🔥 L'ASSIGNATION CRUCIALE : On alimente la variable globale unique
        scene = createScene(); 
        
        // Recalage de la caméra globale au centre exact du monde chargé
        if (camera) {
            const departX = (currentCentreX * 100) + 50;
            const departZ = (currentCentreY * 100) + 50;
            
            camera.position = new BABYLON.Vector3(departX, 50, departZ);
            camera.setTarget(new BABYLON.Vector3(departX, 50, departZ + 10));
        }
        
    } catch (error) {
        document.getElementById("macroPos").innerText = `❌ ERREUR CONFIGURATION SETTINGS`;
        console.error("Détail du blocage :", error);
    }
}

window.addEventListener("DOMContentLoaded", initGame);
window.addEventListener("resize", () => { engine.resize(); });
    </script>
</body>
</html>
